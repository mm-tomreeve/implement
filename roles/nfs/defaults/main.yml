---
# Internal details. Everything an operator sets lives in group_vars/all/defaults.yml.
nfs_packages: [nfs-utils]
# Our own export and config files, so the ones RHEL ships are left alone.
nfs_exports_file: /etc/exports.d/mattermost-implement.exports
# Read after the files nfs-utils ships in the same directory, so these win.
nfs_conf_file: /etc/nfs.conf.d/90-mattermost-implement.conf
