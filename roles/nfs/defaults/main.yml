---
# Internal details. Everything an operator sets lives in group_vars/all/defaults.yml.
# Debian and Ubuntu split the server (nfs-kernel-server) from the client (nfs-common).
nfs_packages: "{{ ['nfs-kernel-server'] if mmd_is_debian | bool else ['nfs-utils'] }}"
# Our own export and config files, so the ones the distribution ships are left alone.
nfs_exports_file: /etc/exports.d/mattermost-parthenon.exports
# Read after the files nfs-utils ships in the same directory, so these win.
nfs_conf_file: /etc/nfs.conf.d/90-mattermost-parthenon.conf
