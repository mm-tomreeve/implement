---
- name: Install Loki
  ansible.builtin.include_role:
    name: common
    tasks_from: tarball_install
  vars:
    tb_name: loki
    tb_artifact: "{{ mmd_artifacts.loki }}"
    tb_user: "{{ loki_user }}"
    tb_creates: "loki-linux-{{ mmd_arch }}"

- name: Restart when the version changed
  ansible.builtin.debug:
    msg: "Loki now points at {{ mmd_artifacts.loki.version }}"
  changed_when: tb_changed | bool
  notify: Restart loki

# Data lives outside /opt so moving the version symlink keeps it.
- name: Create Loki directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ loki_user }}"
    mode: "0750"
  loop:
    - {path: "{{ loki_conf_dir }}", owner: root}
    - {path: "{{ loki_data_dir }}", owner: "{{ loki_user }}"}

# firewalld wants addresses, and the estate may list servers by name.
- name: Look up estate servers given by name
  ansible.builtin.command: getent ahosts {{ item }}
  loop: "{{ _loki_named }}"
  register: _loki_lookups
  changed_when: false
  failed_when: false
  check_mode: false
  vars:
    _loki_ip_re: '^([0-9.]+(/[0-9]+)?|[0-9a-fA-F]*:[0-9a-fA-F:./]*)$'
    _loki_named: >-
      {{ mmd_estate | default([]) | map(attribute='address')
         | reject('in', ['127.0.0.1', 'localhost', '::1'])
         | reject('match', _loki_ip_re) | list }}

- name: Work out who may push logs
  vars:
    _loki_ip_re: '^([0-9.]+(/[0-9]+)?|[0-9a-fA-F]*:[0-9a-fA-F:./]*)$'
  ansible.builtin.set_fact:
    mmd_loki_sources: >-
      {{ ((mmd_estate | default([]) | map(attribute='address')
           | reject('in', ['127.0.0.1', 'localhost', '::1'])
           | select('match', _loki_ip_re) | list)
          + (_loki_lookups.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0)
             | map(attribute='stdout_lines') | map('first') | map('split') | map('first') | list)
          + loki_allowed_sources) | unique }}
    mmd_loki_unresolved: >-
      {{ _loki_lookups.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}

- name: Say which estate names could not be resolved
  ansible.builtin.debug:
    msg: >-
      These estate servers could not be resolved, so the firewall doesn't let them push logs:
      {{ mmd_loki_unresolved | join(', ') }}. Use addresses in monitoring_estate, or add them to loki_allowed_sources.
  when: mmd_loki_unresolved | length > 0

- name: Write the Loki config
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ loki_conf_dir }}/config.yml"
    owner: root
    group: "{{ loki_user }}"
    mode: "0640"
  vars:
    _loki_bind: "{{ '0.0.0.0' if mmd_loki_sources | length > 0 else '127.0.0.1' }}"
  notify: Restart loki

- name: Install the systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/loki.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Mattermost Implement. Local changes are overwritten on the next run.
      [Unit]
      Description=Grafana Loki
      After=network-online.target

      [Service]
      User={{ loki_user }}
      Group={{ loki_user }}
      ExecStart=/opt/loki/loki-linux-{{ mmd_arch }} -config.file={{ loki_conf_dir }}/config.yml
      Restart=always
      LimitNOFILE=65536
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=read-only
      ReadWritePaths={{ loki_data_dir }}

      [Install]
      WantedBy=multi-user.target
  notify: Restart loki

- name: Enable and start Loki
  ansible.builtin.systemd:
    name: loki
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Open Loki to the servers that ship logs here
  ansible.builtin.include_role:
    name: common
    tasks_from: firewall
  vars:
    fw_ports: [{port: "{{ loki_port }}", proto: tcp}]
    fw_sources: "{{ mmd_loki_sources }}"
    fw_public: false
  when: mmd_loki_sources | length > 0

# The collectors installed next start pushing straight away.
- name: Wait for Loki to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ loki_port }}/ready"
  register: _loki_up
  until: _loki_up.status == 200
  retries: 24
  delay: 5
