---
- name: Create the mattermost group
  ansible.builtin.group:
    name: "{{ mattermost_group }}"
    system: true

- name: Create the mattermost user
  ansible.builtin.user:
    name: "{{ mattermost_user }}"
    group: "{{ mattermost_group }}"
    system: true
    shell: /sbin/nologin
    home: "{{ mattermost_dir }}"
    create_home: false

- name: Look at what is at {{ mattermost_dir }} now
  ansible.builtin.stat:
    path: "{{ mattermost_dir }}"
  register: _mm_current

- name: Refuse to overwrite an install this toolkit did not make
  ansible.builtin.assert:
    that: not _mm_current.stat.exists or _mm_current.stat.islnk
    fail_msg: >-
      {{ mattermost_dir }} is a real directory, so Mattermost was installed some other way.
      Move it aside (and its config and data) before running this, or migrate it by hand.

- name: Remember the previous version for the report
  ansible.builtin.set_fact:
    mmd_mattermost_previous: "{{ (_mm_current.stat.lnk_target | default('') | basename | regex_replace('^mattermost-', '')) if _mm_current.stat.exists else '' }}"

- name: Create Mattermost directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mattermost_user }}"
    group: "{{ mattermost_group }}"
    mode: "0750"
  loop:
    - "{{ mattermost_version_dir }}"
    - "{{ mattermost_config_dir }}"
    - "{{ mattermost_plugin_dir }}"
    - "{{ mattermost_client_plugin_dir }}"
    - "{{ mattermost_log_dir }}"

- name: Create the local data directory
  ansible.builtin.file:
    path: "{{ mattermost_data_dir }}"
    state: directory
    owner: "{{ mattermost_user }}"
    group: "{{ mattermost_group }}"
    mode: "0750"
  when: mattermost_file_driver == 'local'

- name: Unpack Mattermost {{ mmd_artifacts.mattermost.version }}
  ansible.builtin.unarchive:
    src: "{{ mmd_artifacts.mattermost.path }}"
    dest: "{{ mattermost_version_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: "{{ mattermost_user }}"
    group: "{{ mattermost_group }}"
    creates: "{{ mattermost_version_dir }}/bin/mattermost"

- name: Trust the install for fapolicyd
  ansible.builtin.include_role:
    name: common
    tasks_from: fapolicyd
  vars:
    fapolicyd_paths: ["{{ mattermost_version_dir }}/"]

- name: Back up before upgrading from {{ mmd_mattermost_installed }}
  when:
    - mmd_mattermost_installed | length > 0
    - mmd_mattermost_installed != mmd_artifacts.mattermost.version
    - mattermost_upgrade_backup | bool
  vars:
    _mm_backup_base: "{{ mattermost_backup_dir }}/mattermost-{{ mmd_mattermost_installed }}-{{ mmd_run_id }}"
  block:
    - name: Enable the PostgreSQL {{ postgresql_version }} module stream for pg_dump (RHEL 9)
      ansible.builtin.command: dnf -y module enable postgresql:{{ postgresql_version }}
      register: _mm_pg_module
      changed_when: "'Nothing to do' not in _mm_pg_module.stdout"
      when:
        - not (mmd_db_local | bool)
        - not mmd_is_debian | bool
        - ansible_facts['distribution_major_version'] == '9'

    # Debian and Ubuntu ship the client for each major version as its own package.
    - name: Install pg_dump
      ansible.builtin.include_role:
        name: common
        tasks_from: package
      vars:
        pkg_names: "{{ ['postgresql-client-' ~ postgresql_version] if mmd_is_debian | bool else ['postgresql'] }}"
      when: not (mmd_db_local | bool)

    - name: Create the backup directory
      ansible.builtin.file:
        path: "{{ mattermost_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # The dump holds the config too. This is a readable copy, and mmctl can only get
    # it from the running server, so before it stops.
    - name: Keep a copy of the config from the database
      ansible.builtin.shell: >-
        umask 077 && {{ (mattermost_dir ~ '/bin/mmctl') | quote }} --local config show > {{ (_mm_backup_base ~ '.config.json') | quote }}
      environment:
        MMCTL_LOCAL_SOCKET_PATH: "{{ mattermost_local_socket }}"
      changed_when: true

    # Mattermost's own upgrade steps: stop the server, back up, then upgrade. The
    # restart handler starts the new version once the symlink has moved.
    - name: Stop Mattermost {{ mmd_mattermost_installed }}
      ansible.builtin.systemd:
        name: mattermost
        state: stopped

    - name: Dump the database
      block:
        - name: Dump the Mattermost database
          ansible.builtin.command:
            argv: [pg_dump, --format=custom, --no-password, --file, "{{ _mm_backup_base }}.dump"]
          environment:
            PGHOST: "{{ mmd_db_host }}"
            PGPORT: "{{ mattermost_db_port }}"
            PGDATABASE: "{{ mattermost_db_name }}"
            PGUSER: "{{ mattermost_db_user }}"
            PGPASSWORD: "{{ mmd_secrets.db_password }}"
            PGSSLMODE: "{{ mmd_db_sslmode }}"
            PGCONNECT_TIMEOUT: "10"
          register: _mm_dump
          changed_when: true
          no_log: true

        - name: Remember the backup for the report
          ansible.builtin.set_fact:
            mmd_mattermost_backup: "{{ _mm_backup_base }}.dump"
      rescue:
        - name: Remove the partial dump
          ansible.builtin.file:
            path: "{{ _mm_backup_base }}.dump"
            state: absent

        - name: Start Mattermost {{ mmd_mattermost_installed }} again
          ansible.builtin.systemd:
            name: mattermost
            state: started

        - name: Stop the upgrade
          ansible.builtin.fail:
            msg: >-
              The database backup failed, so Mattermost stayed on {{ mmd_mattermost_installed }}.
              pg_dump said: {{ _mm_dump.stderr | default(ansible_failed_result.msg | default('nothing')) | trim }}.
              {{ '' if mmd_db_local | bool else 'pg_dump must be the same major version as the database server or newer; set postgresql_version to match. ' }}Fix
              it and re-run, or take your own backup and set mattermost_upgrade_backup: false.

- name: Point {{ mattermost_dir }} at this version
  ansible.builtin.file:
    src: "{{ mattermost_version_dir }}"
    dest: "{{ mattermost_dir }}"
    state: link
    force: true
  notify: Restart mattermost

- name: Trust the OpenSearch CA system-wide
  ansible.builtin.copy:
    src: "{{ mmd_opensearch_ca_src }}"
    dest: "{{ mattermost_opensearch_ca_dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: mmd_opensearch_ca_src | length > 0
  register: _mm_os_ca
  notify: Restart mattermost

- name: Rebuild the system CA bundle
  ansible.builtin.command: update-ca-trust extract
  when: _mm_os_ca is changed  # noqa: no-handler - must run before later tasks, not at play end
  changed_when: true

- name: Install the licence file
  ansible.builtin.copy:
    src: "{{ mattermost_license_file }}"
    dest: "{{ mattermost_license_dest }}"
    remote_src: true
    owner: root
    group: "{{ mattermost_group }}"
    mode: "0640"
  when: mattermost_license_file | length > 0
  notify: Restart mattermost

- name: Work out the settings we own
  ansible.builtin.set_fact:
    _mm_owned: "{{ lookup('ansible.builtin.template', 'config-overrides.yml.j2') | from_yaml }}"
  no_log: true

- name: Write the settings we own as JSON
  ansible.builtin.copy:
    content: "{{ _mm_owned | combine(mattermost_config_overrides, recursive=true) | to_nice_json(indent=4) }}\n"
    dest: "{{ mattermost_owned_config_file }}"
    owner: "{{ mattermost_user }}"
    group: "{{ mattermost_group }}"
    mode: "0600"
  no_log: true

# systemd reads this as root before it starts Mattermost, so only root needs to.
- name: Tell Mattermost which database holds its config
  ansible.builtin.template:
    src: mattermost.env.j2
    dest: "{{ mattermost_env_file }}"
    owner: root
    group: root
    mode: "0600"
  register: _mm_env
  notify: Restart mattermost
  no_log: true

- name: Check whether Mattermost is running
  ansible.builtin.command: systemctl is-active mattermost  # noqa: command-instead-of-module
  register: _mm_active
  changed_when: false
  failed_when: false

# Before Mattermost first starts on this config. On an empty config store this
# writes our settings as the first config; on one that is already there (another
# app server got there first, or an earlier run) it only runs the schema migrations.
- name: Prepare the database and seed the config
  ansible.builtin.command:
    argv: [runuser, -u, "{{ mattermost_user }}", --, "{{ mattermost_dir }}/bin/mattermost", db, init]
    chdir: "{{ mattermost_dir }}"
  environment:
    MM_CONFIG: "{{ _mm_owned.SqlSettings.DataSource }}"
    MM_CUSTOM_DEFAULTS_PATH: "{{ mattermost_owned_config_file }}"
  register: _mm_db_init
  when: _mm_active.stdout != 'active' or _mm_env is changed
  changed_when: true
  failed_when: false
  no_log: true

- name: Stop if the database could not be prepared
  ansible.builtin.fail:
    msg: "mattermost db init failed: {{ (_mm_db_init.stderr | default('') or _mm_db_init.stdout | default('')) | trim }}"
  when: _mm_db_init.rc | default(0) != 0

- name: Install the systemd unit
  ansible.builtin.template:
    src: mattermost.service.j2
    dest: /etc/systemd/system/mattermost.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart mattermost

# Enable before restarting, so a failed first start is still enabled at boot.
- name: Enable Mattermost at boot
  ansible.builtin.systemd:
    name: mattermost
    enabled: true
    daemon_reload: true

# Restart first, so a new version or config starts once, not started and then restarted.
- name: Apply pending restarts
  ansible.builtin.meta: flush_handlers

- name: Start Mattermost
  ansible.builtin.systemd:
    name: mattermost
    state: started

# Re-runs put our settings back into the config. mmctl reaches it only through the
# running server, so this waits for it.
- name: Read the live config
  ansible.builtin.command:
    argv: ["{{ mattermost_dir }}/bin/mmctl", --local, config, show]
  environment:
    MMCTL_LOCAL_SOCKET_PATH: "{{ mattermost_local_socket }}"
  register: _mm_live_config
  until: _mm_live_config.rc == 0
  retries: "{{ (mattermost_start_wait_seconds | int / 5) | int }}"
  delay: 5
  changed_when: false
  no_log: true

- name: Patch our settings into the live config
  ansible.builtin.command:
    argv: ["{{ mattermost_dir }}/bin/mmctl", --local, config, patch, "{{ mattermost_owned_config_file }}"]
  environment:
    MMCTL_LOCAL_SOCKET_PATH: "{{ mattermost_local_socket }}"
  vars:
    _live: "{{ _mm_live_config.stdout | from_json }}"
  when: _live | combine(_mm_owned, mattermost_config_overrides, recursive=true) != _live
  changed_when: true
  notify: Restart mattermost

# A changed setting restarts Mattermost.
- name: Apply the restart for patched settings
  ansible.builtin.meta: flush_handlers

- name: Open Mattermost to remote proxies
  ansible.builtin.include_role:
    name: common
    tasks_from: firewall
  vars:
    fw_ports: [{port: "{{ mattermost_port }}", proto: tcp}]
    fw_sources: "{{ mattermost_proxy_sources }}"
    fw_public: "{{ mattermost_proxy_sources | length == 0 }}"
  when: mmd_mattermost_listen != '127.0.0.1'

- name: Open the cluster port to the other app servers
  ansible.builtin.include_role:
    name: common
    tasks_from: firewall
  vars:
    fw_ports:
      - {port: "{{ mattermost_cluster_port }}", proto: tcp}
      - {port: "{{ mattermost_cluster_port }}", proto: udp}
    fw_sources: "{{ mattermost_cluster_peers }}"
    fw_public: false
  when: mattermost_cluster_peers | length > 0

- name: Open the metrics port to Prometheus servers
  ansible.builtin.include_role:
    name: common
    tasks_from: firewall
  vars:
    fw_ports: [{port: "{{ mattermost_metrics_port }}", proto: tcp}]
    fw_sources: "{{ mmd_scrape_sources }}"
    fw_public: false
  when: mmd_mattermost_metrics | bool and mmd_scrape_sources | length > 0

- name: Open the built-in Calls media port
  ansible.builtin.include_role:
    name: common
    tasks_from: firewall
  vars:
    fw_ports:
      - {port: "{{ mattermost_calls_port }}", proto: udp}
      - {port: "{{ mattermost_calls_port }}", proto: tcp}
    fw_public: true
  when: mmd_calls_integrated | bool

# Plain HTTP unless Mattermost's own config turns TLS on, so try both. The certificate
# won't match 127.0.0.1, and this is loopback only.
- name: Wait for Mattermost to answer (first start runs migrations)
  ansible.builtin.shell: |
    for scheme in https http; do
      code=$(curl --silent --insecure --max-time 5 --output /dev/null --write-out '%{http_code}' \
        "$scheme://127.0.0.1:{{ mattermost_port }}/api/v4/system/ping")
      [ "$code" = 200 ] && { echo "$scheme"; exit 0; }
    done
    exit 1
  register: _mm_ping
  until: _mm_ping.rc == 0
  retries: "{{ (mattermost_start_wait_seconds | int / 5) | int }}"
  delay: 5
  changed_when: false
