---
- name: Plan the deployment
  ansible.builtin.include_tasks: plan.yml

- name: Check the files the answer file points at
  ansible.builtin.include_tasks: input_files.yml

- name: Check the ports are free
  ansible.builtin.include_tasks: ports.yml

- name: Load or generate secrets
  ansible.builtin.include_tasks: secrets.yml

- name: Apply the baseline
  ansible.builtin.include_tasks: baseline.yml
