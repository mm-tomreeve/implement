---
# Everything needed to describe the deployment without changing the server.
# playbooks/plan.yml runs only this file, so it must stay read-only.
- name: Check the answer file
  ansible.builtin.include_tasks: answers.yml

- name: Check the operating system
  ansible.builtin.include_tasks: assert_os.yml

- name: Work out which components go on this server
  ansible.builtin.include_tasks: selection.yml

- name: Work out how the components connect
  ansible.builtin.include_tasks: wiring.yml

- name: Validate dependencies, colocation and sizing
  ansible.builtin.include_tasks: validate.yml
