---
- name: Check hard dependencies between components
  ansible.builtin.assert:
    that: item.ok | bool
    fail_msg: "{{ item.message }}"
    quiet: true
  loop: "{{ mmd_dependency_checks | selectattr('component', 'in', mmd_selected) | list }}"
  loop_control:
    label: "{{ item.component }}: {{ item.message | truncate(60) }}"

- name: Evaluate colocation advice
  ansible.builtin.set_fact:
    mmd_findings: >-
      {%- set out = [] -%}
      {%- set major = mmd_selected | intersect(common_major_components) -%}
      {%- for r in mmd_colocation_rules -%}
      {%-   set hit = namespace(v=false) -%}
      {%-   if r.when_all is defined and r.when_all | difference(mmd_selected) | length == 0 -%}{%- set hit.v = true -%}{%- endif -%}
      {%-   if r.when_count_at_least is defined and major | length >= r.when_count_at_least -%}{%- set hit.v = true -%}{%- endif -%}
      {%-   if r.when_any_with is defined and (r.when_any_with | intersect(mmd_selected) | length > 0)
             and (r.workloads | intersect(mmd_selected) | length > 0) -%}{%- set hit.v = true -%}{%- endif -%}
      {%-   if hit.v -%}{%- set _ = out.append({'id': r.id, 'severity': r.severity, 'message': r.message, 'advice': r.advice}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Compare the host with the sizing hints
  ansible.builtin.set_fact:
    mmd_sizing:
      ram_needed_mb: "{{ mmd_selected | map('extract', mmd_catalogue) | map(attribute='min_ram_mb') | sum }}"
      ram_have_mb: "{{ ansible_facts['memtotal_mb'] }}"
      cpus_needed: "{{ [mmd_selected | map('extract', mmd_catalogue) | map(attribute='min_cpus') | sum, 1] | max }}"
      cpus_have: "{{ ansible_facts['processor_vcpus'] }}"

- name: Add a sizing finding when the host looks small
  ansible.builtin.set_fact:
    mmd_findings: >-
      {{ mmd_findings + [{
           'id': 'undersized',
           'severity': 'high',
           'message': 'This server has ' ~ mmd_sizing.ram_have_mb ~ ' MB RAM and ' ~ mmd_sizing.cpus_have
                      ~ ' vCPUs. The selected components want at least ' ~ mmd_sizing.ram_needed_mb ~ ' MB and '
                      ~ mmd_sizing.cpus_needed ~ ' vCPUs between them.',
           'advice': 'Expect poor performance or out-of-memory kills. Add resources or spread the components over more servers.'}] }}
  when: >-
    (mmd_sizing.ram_have_mb | int) < (mmd_sizing.ram_needed_mb | int)
    or (mmd_sizing.cpus_have | int) < (mmd_sizing.cpus_needed | int)

- name: Add a finding when this server's logs aren't shipped anywhere
  ansible.builtin.set_fact:
    mmd_findings: >-
      {{ mmd_findings + [{
           'id': 'no-log-shipping',
           'severity': 'low',
           'message': 'Logs stay on this server: ' ~ mmd_log_shipping_skipped ~ '.',
           'advice': 'Set logging_loki_url to the monitoring server (e.g. http://10.10.1.15:3100) and re-run, '
                     ~ 'so its logs can be searched in Grafana and the log alerts cover it.'}] }}
  when:
    - deploy_log_shipping | bool
    - mmd_log_shipping_skipped | length > 0
    # Only where a monitoring server watches this one; a standalone server has nowhere to ship to.
    - monitoring_scrape_sources | length > 0

- name: Add a finding when PostgreSQL may run out of connections
  ansible.builtin.set_fact:
    mmd_findings: >-
      {{ mmd_findings + [{
           'id': 'db-connections',
           'severity': 'high' if _short else 'medium',
           'message': ('max_connections is ' ~ mmd_postgresql_max_connections ~ ', but ' ~ mmd_postgresql_app_servers
                       ~ ' app server(s) may each open ' ~ mattermost_db_max_open_conns ~ ' connections.')
                      if _short else
                      ('postgresql_allowed_clients lists a subnet, so max_connections ('
                       ~ mmd_postgresql_max_connections ~ ') assumes one app server per entry.'),
           'advice': 'Set postgresql_app_servers to the number of Mattermost servers using this database, '
                     ~ 'or leave postgresql_max_connections on auto.'}] }}
  vars:
    _short: >-
      {{ mmd_postgresql_max_connections | int
         < mmd_postgresql_app_servers | int * mattermost_db_max_open_conns | int + 10 }}
    _subnet: >-
      {{ postgresql_app_servers == 'auto'
         and postgresql_allowed_clients | select('search', '/(?!32$|128$)') | list | length > 0 }}
  when:
    - "'postgresql' in mmd_selected"
    - _short | bool or _subnet | bool

- name: Add a finding when Mattermost will be upgraded
  ansible.builtin.set_fact:
    mmd_findings: >-
      {{ mmd_findings + [{
           'id': 'mattermost-upgrade',
           'severity': 'medium',
           'message': 'Mattermost ' ~ mmd_mattermost_installed ~ ' is installed and this run may upgrade it.',
           'advice': 'Mattermost is stopped for the upgrade. Database migrations only go forwards, so '
                     ~ ('the database is dumped to ' ~ mattermost_backup_dir ~ ' first.'
                        if mattermost_upgrade_backup | bool else 'have a backup ready: mattermost_upgrade_backup is off.')}] }}
  when:
    - "'mattermost' in mmd_selected"
    - mmd_mattermost_installed | length > 0
    - not (mmd_mattermost_hold | bool)
    - mattermost_version_channel != 'pinned' or mattermost_version is version(mmd_mattermost_installed, '>')

- name: Add a finding when the pinned Mattermost is older than the installed one
  ansible.builtin.set_fact:
    mmd_findings: >-
      {{ mmd_findings + [{
           'id': 'mattermost-downgrade',
           'severity': 'high',
           'message': 'mattermost_version ' ~ mattermost_version ~ ' is older than the installed '
                      ~ mmd_mattermost_installed ~ ', so the install will stop.',
           'advice': 'Its database has already been migrated forwards. Pin ' ~ mmd_mattermost_installed
                     ~ ' or newer, or restore the pre-upgrade dump and move ' ~ mattermost_dir ~ ' back by hand.'}] }}
  when:
    - "'mattermost' in mmd_selected"
    - mmd_mattermost_installed | length > 0
    - mattermost_version_channel == 'pinned'
    - mattermost_version is version(mmd_mattermost_installed, '<')

- name: Add a finding about how replication fails over
  ansible.builtin.set_fact:
    mmd_findings: >-
      {{ mmd_findings + [{
           'id': 'db-replication',
           'severity': 'medium',
           'message': ('This server is a read-only replica of ' ~ postgresql_primary_host ~ '.')
                      if postgresql_replication == 'replica' else
                      ('This server feeds read replicas on ' ~ postgresql_replica_hosts | join(', ')
                       ~ '. Each may hold up to ' ~ mmd_postgresql_slot_wal_cap_mb ~ ' MB of WAL here while it is down.'),
           'advice': 'Replication spreads reads; it is not automatic failover. If the primary is lost, promote a replica '
                     ~ 'by hand (pg_ctl promote), point mattermost_db_host at it and re-run the app servers. '
                     ~ 'A replica that falls further behind than the WAL limit has to be rebuilt.'}] }}
  when:
    - "'postgresql' in mmd_selected"
    - postgresql_replication in ['primary', 'replica']

- name: Show the plan
  ansible.builtin.debug:
    msg: "{{ _plan_lines }}"
  vars:
    _plan_lines: >-
      {{ ['Components on this server: ' ~ (mmd_selected | join(', '))]
         + ['Profiles: ' ~ (mmd_profiles_used | join(', ') if mmd_profiles_used else 'none (custom selection)')]
         + (mmd_findings | map(attribute='message') | map('regex_replace', '^', 'WARNING: ') | list) }}

- name: Show colocation and sizing advice
  ansible.builtin.debug:
    msg: "[{{ item.severity | upper }}] {{ item.message }} {{ item.advice }}"
  loop: "{{ mmd_findings }}"
  loop_control:
    label: "{{ item.id }}"
