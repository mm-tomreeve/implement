---
# ufw and firewalld both drive the kernel's packet filter. Run together they overwrite each
# other's rules, so stop before installing firewalld if ufw is already in charge.
- name: Check whether ufw is active
  ansible.builtin.command: ufw status
  register: _ufw_status
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - mmd_is_debian | bool
    - firewall_manage | bool

- name: Stop if ufw is in charge of the firewall
  ansible.builtin.assert:
    that: "'Status: active' not in _ufw_status.stdout | default('')"
    fail_msg: >-
      ufw is active on this server. Mattermost Parthenon manages the firewall with firewalld, and the
      two would overwrite each other's rules. Either turn ufw off (ufw disable) and run this again, or
      set firewall_manage: false and open the ports yourself. The report lists them.
    quiet: true
  when:
    - mmd_is_debian | bool
    - firewall_manage | bool

- name: Install baseline packages
  ansible.builtin.include_tasks: package.yml
  vars:
    pkg_names: "{{ common_packages }}"

- name: Refresh network facts now iproute is present
  ansible.builtin.setup:
    gather_subset: [network]

- name: Keep firewalld running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  when: firewall_manage | bool

- name: Keep time in sync
  ansible.builtin.systemd:
    name: "{{ mmd_chrony_service }}"
    state: started
    enabled: true

- name: Make sure /etc/sysctl.d exists (missing on some minimal images)
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create deployer state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ deploy_state_dir }}"
    - "{{ deploy_state_dir }}/results"
    - "{{ deploy_state_dir }}/reports"
    - "{{ artifact_cache_dir }}"
