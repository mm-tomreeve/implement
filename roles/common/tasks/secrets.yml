---
# Passwords left blank in the answer file are generated once and kept in
# secrets.yml (root only, 0600). Later runs reuse them so nothing drifts.
- name: Ensure the deployer config directory exists
  ansible.builtin.file:
    path: "{{ deploy_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Look for stored secrets
  ansible.builtin.stat:
    path: "{{ deploy_config_dir }}/secrets.yml"
  register: _secrets_file

- name: Read stored secrets
  ansible.builtin.slurp:
    path: "{{ deploy_config_dir }}/secrets.yml"
  register: _secrets_raw
  when: _secrets_file.stat.exists
  no_log: true

- name: Settle secrets
  ansible.builtin.set_fact:
    mmd_secrets:
      db_password: "{{ mattermost_db_password or _stored.db_password | default('') or lookup(_gen, '/dev/null length=32 chars=ascii_letters,digits') }}"
      opensearch_admin_password: "{{ opensearch_admin_password or _stored.opensearch_admin_password | default('') or lookup(_gen, '/dev/null length=32 chars=ascii_letters,digits') }}"
      opensearch_mattermost_password: "{{ mattermost_opensearch_password or _stored.opensearch_mattermost_password | default('') or lookup(_gen, '/dev/null length=32 chars=ascii_letters,digits') }}"
      grafana_admin_password: "{{ grafana_admin_password or _stored.grafana_admin_password | default('') or lookup(_gen, '/dev/null length=24 chars=ascii_letters,digits') }}"
  vars:
    _gen: ansible.builtin.password
    _stored: "{{ (_secrets_raw.content | b64decode | from_yaml) if (_secrets_raw.content is defined) else {} }}"
  no_log: true

- name: Store secrets
  ansible.builtin.copy:
    dest: "{{ deploy_config_dir }}/secrets.yml"
    content: |
      # Generated by Mattermost Implement. Root only. Copy values from here into the
      # answer file of any other server that needs them (for example the database
      # password on a separate app server).
      {{ mmd_secrets | to_nice_yaml }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
