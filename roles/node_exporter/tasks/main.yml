---
- name: Install node_exporter
  ansible.builtin.include_role:
    name: common
    tasks_from: tarball_install
  vars:
    tb_name: node_exporter
    tb_artifact: "{{ mmd_artifacts.node_exporter }}"
    tb_user: "{{ node_exporter_user }}"

- name: Restart when the version changed
  ansible.builtin.debug:
    msg: "node_exporter now points at {{ mmd_artifacts.node_exporter.version }}"
  changed_when: tb_changed | bool
  notify: Restart node_exporter

- name: Install the systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Mattermost Implement. Local changes are overwritten on the next run.
      [Unit]
      Description=Prometheus node_exporter
      After=network-online.target

      [Service]
      User={{ node_exporter_user }}
      ExecStart=/opt/node_exporter/node_exporter --web.listen-address={{ mmd_exporter_bind }}:{{ node_exporter_port }}{% for c in node_exporter_collectors %} --collector.{{ c }}{% endfor %} --collector.systemd.unit-include=({{ node_exporter_watched_units | join('|') }})\\.service

      Restart=always
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=read-only

      [Install]
      WantedBy=multi-user.target
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Open the exporter to Prometheus servers
  ansible.builtin.include_role:
    name: common
    tasks_from: firewall
  vars:
    fw_ports: [{port: "{{ node_exporter_port }}", proto: tcp}]
    fw_sources: "{{ monitoring_scrape_sources }}"
    fw_public: false
  when: monitoring_scrape_sources | length > 0
