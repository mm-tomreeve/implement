---
- name: Install Prometheus
  ansible.builtin.include_role:
    name: common
    tasks_from: tarball_install
  vars:
    tb_name: prometheus
    tb_artifact: "{{ mmd_artifacts.prometheus }}"
    tb_user: "{{ prometheus_user }}"

- name: Restart when the version changed
  ansible.builtin.debug:
    msg: "Prometheus now points at {{ mmd_artifacts.prometheus.version }}"
  changed_when: tb_changed | bool
  notify: Restart prometheus

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ prometheus_user }}"
    mode: "0750"
  loop:
    - {path: "{{ prometheus_conf_dir }}", owner: root}
    - {path: "{{ prometheus_data_dir }}", owner: "{{ prometheus_user }}"}

- name: Write prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_conf_dir }}/prometheus.yml"
    owner: root
    group: "{{ prometheus_user }}"
    mode: "0640"
    validate: /opt/prometheus/promtool check config %s
  notify: Reload prometheus

- name: Install the systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true

# prometheus_allowed_sources, the Prometheus servers that scrape this one, and the
# estate's Grafana and Prometheus servers that query it (common/tasks/wiring.yml).
- name: Open Prometheus to listed hosts and the estate servers that query it
  ansible.builtin.include_role:
    name: common
    tasks_from: firewall
  vars:
    fw_ports: [{port: "{{ prometheus_port }}", proto: tcp}]
    fw_sources: "{{ mmd_prometheus_sources }}"
    fw_public: false
  when: mmd_prometheus_sources | length > 0
