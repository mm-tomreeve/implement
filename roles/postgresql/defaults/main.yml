---
# The server package. Debian and Ubuntu name it for the major version, and install that
# version only; the cluster tools come from postgresql-common, installed ahead of it.
postgresql_packages: "{{ ['postgresql-' ~ postgresql_version] if mmd_is_debian | bool else ['postgresql-server', 'postgresql-contrib'] }}"
postgresql_initdb_options: "--encoding=UTF8 --locale=C.UTF-8 --auth-local=peer --auth-host=scram-sha-256"
postgresql_work_mem: 16MB
postgresql_random_page_cost: 1.1
