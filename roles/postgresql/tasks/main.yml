---
- name: Enable the PostgreSQL {{ postgresql_version }} module stream (RHEL 9)
  ansible.builtin.command: dnf -y module enable postgresql:{{ postgresql_version }}
  register: _pg_module
  changed_when: "'Nothing to do' not in _pg_module.stdout"
  when:
    - not mmd_is_debian | bool
    - ansible_facts['distribution_major_version'] == '9'

# Debian and Ubuntu make a cluster called "main" the moment the server package lands, with
# their own idea of encoding and locale. Turn that off first and make the cluster ourselves,
# the way the RHEL path does with postgresql-setup. The package that owns the setting comes first.
- name: Install the PostgreSQL cluster tools (Debian and Ubuntu)
  ansible.builtin.include_role:
    name: common
    tasks_from: package
  vars:
    pkg_names: [postgresql-common]
  when: mmd_is_debian | bool

- name: Stop the package making a default cluster (Debian and Ubuntu)
  ansible.builtin.lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: "^#?create_main_cluster\\s*="
    line: "create_main_cluster = false  # Managed by Mattermost Parthenon"
  when: mmd_is_debian | bool

- name: Install PostgreSQL
  ansible.builtin.include_role:
    name: common
    tasks_from: package
  vars:
    pkg_names: "{{ postgresql_packages }}"

- name: Initialise the cluster
  ansible.builtin.command: postgresql-setup --initdb
  args:
    creates: "{{ postgresql_data_dir }}/PG_VERSION"
  environment:
    PGSETUP_INITDB_OPTIONS: "{{ postgresql_initdb_options }}"
  when:
    - not mmd_is_debian | bool
    - postgresql_replication != 'replica'

# The configuration is the sign a cluster exists here, because the data directory comes
# and goes with a replica's copy.
- name: Create the cluster (Debian and Ubuntu)
  ansible.builtin.command:
    argv: [pg_createcluster, --datadir, "{{ postgresql_data_dir }}", "{{ postgresql_version }}", main, --,
           --encoding=UTF8, --locale=C.UTF-8, --auth-local=peer, --auth-host=scram-sha-256]
    creates: "{{ postgresql_conf_dir }}/postgresql.conf"
  register: _pg_created
  when: mmd_is_debian | bool

# A replica copies the primary into an empty directory. pg_createcluster initialised one
# a moment ago, so clear that out, but only when this run made it.
- name: Empty the new cluster so a replica can copy the primary into it
  when:
    - mmd_is_debian | bool
    - postgresql_replication == 'replica'
    - _pg_created is changed
  block:
    - name: Remove the empty database
      ansible.builtin.file:
        path: "{{ postgresql_data_dir }}"
        state: absent

    - name: Put the data directory back, empty
      ansible.builtin.file:
        path: "{{ postgresql_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

- name: Copy and follow the primary
  ansible.builtin.include_tasks: replica.yml
  when: postgresql_replication == 'replica'

- name: Label a non-standard port for SELinux
  ansible.builtin.command: semanage port -a -t postgresql_port_t -p tcp {{ postgresql_port }}
  register: _pg_seport
  changed_when: _pg_seport.rc == 0
  failed_when: _pg_seport.rc != 0 and 'already defined' not in _pg_seport.stderr
  when:
    - mmd_selinux_manage | bool
    - postgresql_port | int != 5432

- name: Create the conf.d directory
  ansible.builtin.file:
    path: "{{ postgresql_conf_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Include conf.d from postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_dir }}/postgresql.conf"
    regexp: "^#?include_dir\\s*="
    line: "include_dir = 'conf.d'"
  notify: Restart postgresql

- name: Create a self-signed server certificate for remote clients
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:3072
      - -nodes
      - -days
      - "1825"
      - -subj
      - "/CN={{ ansible_facts['fqdn'] }}"
      - -keyout
      - "{{ postgresql_data_dir }}/server.key"
      - -out
      - "{{ postgresql_data_dir }}/server.crt"
    creates: "{{ postgresql_data_dir }}/server.crt"
  when: mmd_postgresql_ssl | bool
  notify: Restart postgresql

- name: Lock down the server key
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/{{ item }}"
    owner: postgres
    group: postgres
    mode: "0600"
  loop: [server.key, server.crt]
  when: mmd_postgresql_ssl | bool

- name: Create the log directory for shipped logs
  ansible.builtin.file:
    path: "{{ postgresql_log_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
    # The policy labels /var/log/postgresql postgresql_log_t; set it in case the path differs.
    setype: "{{ 'postgresql_log_t' if (mmd_selinux_manage | bool and ansible_facts['selinux']['status'] | default('disabled') == 'enabled') else omit }}"
  when: "'otel_collector' in mmd_selected"

- name: Write Mattermost tuning
  ansible.builtin.template:
    src: mattermost.conf.j2
    dest: "{{ postgresql_conf_dir }}/conf.d/mattermost.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart postgresql

- name: Write the replication settings
  ansible.builtin.template:
    src: replication.conf.j2
    dest: "{{ postgresql_conf_dir }}/conf.d/replication.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  when: postgresql_replication in ['primary', 'replica']
  notify: Reload postgresql

- name: Remove replication settings this server no longer needs
  ansible.builtin.file:
    path: "{{ postgresql_conf_dir }}/conf.d/replication.conf"
    state: absent
  when: postgresql_replication == 'none'
  notify: Restart postgresql

- name: Write pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_conf_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
    backup: true
  notify: Reload postgresql

- name: Start PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true
    # Debian and Ubuntu generate a unit for each cluster, so systemd has to look again.
    daemon_reload: "{{ mmd_is_debian | bool }}"

- name: Apply pending restarts before creating the database
  ansible.builtin.meta: flush_handlers

- name: Wait for PostgreSQL to accept connections
  ansible.builtin.wait_for:
    port: "{{ postgresql_port }}"
    host: 127.0.0.1
    timeout: 60

- name: Create the Mattermost role and database
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, "{{ mmd_postgresql_bin_dir }}/psql", -X, -v, ON_ERROR_STOP=1, -p, "{{ postgresql_port }}", -d, postgres]
    stdin: |
      \set mm_user '{{ mattermost_db_user | replace("\\", "\\\\") | replace("'", "''") }}'
      \set mm_db '{{ mattermost_db_name | replace("\\", "\\\\") | replace("'", "''") }}'
      \set mm_pass '{{ mmd_secrets.db_password | replace("\\", "\\\\") | replace("'", "''") }}'
      SELECT format('CREATE ROLE %I LOGIN', :'mm_user') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'mm_user')\gexec
      SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'mm_user', :'mm_pass')\gexec
      SELECT format('CREATE DATABASE %I OWNER %I ENCODING ''UTF8'' TEMPLATE template0', :'mm_db', :'mm_user') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'mm_db')\gexec
      SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'mm_db')\gexec
  register: _pg_sql
  changed_when: "'CREATE' in _pg_sql.stdout"
  no_log: true
  # A replica is read-only. Its role and database arrive from the primary.
  when: postgresql_replication != 'replica'

- name: Create the replication role
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, "{{ mmd_postgresql_bin_dir }}/psql", -X, -v, ON_ERROR_STOP=1, -p, "{{ postgresql_port }}", -d, postgres]
    stdin: |
      \set r_user '{{ postgresql_replication_user | replace("\\", "\\\\") | replace("'", "''") }}'
      \set r_pass '{{ mmd_secrets.replication_password | replace("\\", "\\\\") | replace("'", "''") }}'
      SELECT format('CREATE ROLE %I WITH REPLICATION LOGIN', :'r_user') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'r_user')\gexec
      SELECT format('ALTER ROLE %I WITH REPLICATION LOGIN PASSWORD %L', :'r_user', :'r_pass')\gexec
  register: _pg_repl_sql
  changed_when: "'CREATE' in _pg_repl_sql.stdout"
  no_log: true
  when: postgresql_replication == 'primary'

- name: Open the PostgreSQL port to the Mattermost servers and replicas
  ansible.builtin.include_role:
    name: common
    tasks_from: firewall
  vars:
    fw_ports: [{port: "{{ postgresql_port }}", proto: tcp}]
    fw_sources: "{{ mmd_postgresql_remote }}"
    fw_public: false
  when: mmd_postgresql_remote | length > 0
