---
# Defaults for every setting the answer file can override.
# The answer file is passed with -e @answers.yml, so anything set there wins.
# answers.example.yml documents each setting for operators.

# ---------------------------------------------------------------- deployment
deploy_name: mattermost
deploy_profiles: []
deploy_components: []
# Install node_exporter (and postgres_exporter where PostgreSQL is local) so a
# Prometheus server can scrape this host. Always on when Prometheus is local.
deploy_monitoring_exporters: false
# Set by install.sh after it has tested connectivity. Do not set by hand.
deploy_online: false
deploy_state_dir: /var/lib/mattermost-parthenon
deploy_config_dir: /etc/mattermost-parthenon
deploy_tool_version: unknown
deploy_operator: "{{ lookup('ansible.builtin.env', 'SUDO_USER') | default('root', true) }}"
# Firewalld and SELinux handling. Debian and Ubuntu have no SELinux, so selinux_manage does
# nothing there. Firewalld is installed and used on those too (see docs/roles.md).
firewall_manage: true
firewall_zone: public
selinux_manage: true

# ---------------------------------------------------------------- artifacts
# Offline directory or internal mirror URL. When set it is always used, even if
# the server can reach the internet.
artifact_source: ""
artifact_cache_dir: /var/cache/mattermost-parthenon
# Refuse a Mattermost or OpenSearch tarball whose GPG signature cannot be checked.
artifact_require_signature: true
# Allow artifacts with no published or bundled checksum. Leave this off.
artifact_allow_unverified: false

# ---------------------------------------------------------------- mattermost
mattermost_edition: enterprise            # enterprise | team
mattermost_version_channel: latest-stable # latest-stable | latest-esr | pinned
mattermost_version: ""                    # required when the channel is pinned
mattermost_sha256: ""                     # optional extra check for a pinned build
# Once Mattermost is installed, re-runs stay on the installed version even when the
# channel has moved on. Set this (or pass install.sh --upgrade) to move to the newer
# release. A pinned version that changes is an upgrade on its own. Downgrades are refused.
mattermost_allow_upgrade: false
# Before an upgrade, stop Mattermost and pg_dump its database. Only switch this off
# if you have just taken your own backup.
mattermost_upgrade_backup: true
mattermost_backup_dir: /var/lib/mattermost-parthenon/backups
mattermost_gpg_fingerprint: A1B31D46F0F3A10B02CF2D44F8F2C31744774B28
mattermost_site_url: "https://{{ ansible_facts['fqdn'] }}"
mattermost_user: mattermost
mattermost_group: mattermost
mattermost_install_root: /opt
mattermost_dir: /opt/mattermost
mattermost_config_dir: /etc/mattermost
mattermost_data_dir: /var/opt/mattermost/data
mattermost_plugin_dir: /var/opt/mattermost/plugins
mattermost_client_plugin_dir: /var/opt/mattermost/client-plugins
mattermost_log_dir: /var/log/mattermost
mattermost_port: 8065
# auto = 127.0.0.1 when Nginx is on this host and no remote proxies are listed.
mattermost_listen_address: auto
# Remote reverse proxies allowed to reach port 8065 (CIDRs or IPs).
mattermost_proxy_sources: []
mattermost_metrics_port: 8067
# The other Mattermost app servers (addresses or CIDRs). Setting any turns clustering on
# (Enterprise, needs a licence file) and opens mattermost_cluster_port to them only.
# Leave empty for a single app server.
mattermost_cluster_peers: []
# Cluster gossip between app servers, TCP and UDP. Opened to the peers only.
mattermost_cluster_port: 8074
# Must match on every node. Defaults to the deployment name.
mattermost_cluster_name: "{{ deploy_name }}"
mattermost_license_file: ""
# Turn on OpenSearch indexing and searching. Needs an Enterprise licence.
mattermost_search_enable: "{{ mattermost_license_file | length > 0 }}"
# Mattermost's own Prometheus metrics on mattermost_metrics_port. They need an
# Enterprise licence, so auto = the Enterprise build with a licence file given.
# Set it to true if you apply the licence in the System Console instead.
mattermost_metrics_enable: auto
# Extra settings deep-merged into config.json last.
mattermost_config_overrides: {}
# Where Mattermost keeps its config. file = config.json on this server. database = a
# table in Mattermost's own database, shared by every app server, so the System
# Console stays editable when there are several. Install one app server first.
mattermost_config_store: file             # file | database
# How long to wait for Mattermost to answer once it has started. The first start runs
# schema migrations, so raise this for upgrades on a big database or on slow hosts.
mattermost_start_wait_seconds: 60
# Open 8443 udp/tcp for the built-in Calls media server when no rtcd is used.
mattermost_calls_integrated: true
mattermost_calls_port: 8443

# Call recording, transcription and live captions. These need a job service
# (calls_offloader on this host, or mattermost_job_service_url) and an Enterprise
# licence. auto = on when both are there.
mattermost_calls_recording: auto
# 15 to 180. The longer this is, the bigger the file that has to upload at the end.
mattermost_calls_max_recording_minutes: 60
# low (720p15), medium (720p20) or high (1080p20). Higher quality means fewer
# concurrent recordings per job server and a much bigger file.
mattermost_calls_recording_quality: medium
# Transcribe the recording once the call ends. Needs recording.
mattermost_calls_transcriptions: true
# whisper.cpp model: tiny, base or small. Bigger is more accurate and much slower:
# on 4 threads a 60-minute call takes roughly 3m30s (tiny), 7m (base) or 23m (small).
mattermost_calls_transcriber_model: base
mattermost_calls_transcriber_threads: 2
# Live captions during the call. Off by default: it is the only one of the three
# that has to keep up in real time, and it holds a transcriber per call.
mattermost_calls_live_captions: false
mattermost_calls_live_captions_model: tiny
mattermost_calls_live_captions_transcribers: 1
# The address job containers use to reach Mattermost, when the site URL isn't one
# they can resolve or route to. Added to AllowCorsFrom as well.
mattermost_calls_internal_site_url: ""

# Database as Mattermost sees it. The PostgreSQL role uses the same values.
mattermost_db_host: ""          # blank = local PostgreSQL
mattermost_db_port: 5432
mattermost_db_name: mattermost
mattermost_db_user: mmuser
mattermost_db_password: ""      # blank = generated and stored in secrets.yml
mattermost_db_sslmode: auto     # auto = disable locally, require for remote
# SqlSettings.MaxOpenConns on each app server. PostgreSQL sizes max_connections from it.
# Mattermost's default since v11.0, when it came down from 300. The pool is per data
# source per app server, so every app server may open this many against the primary
# and this many again against each read replica.
mattermost_db_max_open_conns: 100
# SqlSettings.MaxIdleConns. Mattermost asks for a 2:1 ratio with MaxOpenConns.
mattermost_db_max_idle_conns: "{{ (mattermost_db_max_open_conns | int / 2) | round | int }}"
# PostgreSQL read replicas Mattermost sends reads to (SqlSettings.DataSourceReplicas,
# Enterprise only). Same port, database, login and password as the primary.
mattermost_db_replica_hosts: []

# File storage. We consume storage, we do not build it.
mattermost_file_driver: local   # local | amazons3
mattermost_s3_endpoint: ""      # host[:port], no scheme
mattermost_s3_bucket: ""
mattermost_s3_region: ""
mattermost_s3_access_key: ""
mattermost_s3_secret_key: ""
mattermost_s3_ssl: true
mattermost_s3_path_prefix: ""

# Remote services Mattermost should use when they are not on this host.
mattermost_rtcd_url: ""         # e.g. http://rtcd01.internal:8045
mattermost_job_service_url: ""  # e.g. http://jobs01.internal:4545 (call recording)
mattermost_opensearch_url: ""   # e.g. https://search01.internal:9200
mattermost_opensearch_username: mattermost
mattermost_opensearch_password: ""
mattermost_opensearch_ca_file: ""
# SqlSettings.DisableDatabaseSearch. Mattermost says turning database search off
# once a search engine is running may improve performance on larger deployments,
# because the fallback is what hurts. The cost is that search stops entirely when
# OpenSearch is down, so it is off by default. Only read when OpenSearch is in use.
mattermost_disable_database_search: false

# ---------------------------------------------------------------- postgresql
# RHEL: the 16 stream from AppStream. Debian and Ubuntu: the version the release ships
# (see mmd_debian_postgresql_versions in platform.yml).
postgresql_version: "{{ mmd_debian_postgresql_default if mmd_is_debian | bool else '16' }}"
postgresql_port: "{{ mattermost_db_port }}"
# Mattermost app servers allowed to connect (CIDRs). Empty = localhost only.
postgresql_allowed_clients: []
# Mattermost app servers that use this database. auto = one per entry in
# postgresql_allowed_clients (plus this server when Mattermost is local). Set it
# when a client entry is a subnet holding several app servers.
postgresql_app_servers: auto
# auto = mattermost_db_max_open_conns for every app server, plus
# postgresql_spare_connections for the exporter, admin sessions and maintenance.
postgresql_max_connections: auto
postgresql_spare_connections: 50
# auto = on when remote clients are allowed (self-signed certificate).
postgresql_ssl: auto
# Where the data lives. Debian and Ubuntu keep one cluster per major version in a
# directory of its own, with the configuration under /etc/postgresql.
postgresql_data_dir: "{{ ('/var/lib/postgresql/' ~ postgresql_version ~ '/main') if mmd_is_debian | bool else '/var/lib/pgsql/data' }}"
# Where postgresql.conf and pg_hba.conf live. The data directory on RHEL.
postgresql_conf_dir: "{{ ('/etc/postgresql/' ~ postgresql_version ~ '/main') if mmd_is_debian | bool else postgresql_data_dir }}"
# When this server ships its logs, PostgreSQL writes JSON logs (jsonlog) here instead of
# the text log in the data directory, so the log alerts can match on SQLSTATE codes.
postgresql_log_dir: /var/log/postgresql
# Share of RAM for shared_buffers and effective_cache_size. Lower when Mattermost shares the box.
postgresql_shared_buffers_pct: "{{ 15 if 'mattermost' in mmd_selected else 25 }}"
postgresql_effective_cache_pct: "{{ 50 if 'mattermost' in mmd_selected else 75 }}"
# Streaming replication. none = a standalone server. primary = this server feeds
# read replicas. replica = a read-only copy of postgresql_primary_host.
postgresql_replication: none
# On the primary: replica servers allowed to stream WAL from here (IPs or CIDRs).
postgresql_replica_hosts: []
# On a replica: the primary to copy from and follow.
postgresql_primary_host: ""
postgresql_replication_user: replicator
# Blank = generated on the primary. Copy it from there into each replica's answers.
postgresql_replication_password: ""
postgresql_replication_sslmode: require
# Where a replica keeps the replication password (the postgres user's home).
postgresql_passfile: "{{ '/var/lib/postgresql/.pgpass' if mmd_is_debian | bool else '/var/lib/pgsql/.pgpass' }}"
# The slot this replica holds on the primary. One per replica.
postgresql_replication_slot: "{{ ansible_facts['hostname'] | lower | regex_replace('[^a-z0-9_]', '_') }}"
# Most WAL the primary keeps for a replica that is down or behind, so a lost
# replica can't fill the primary's disk. Past this the replica has to be rebuilt.
# auto = postgresql_slot_wal_keep_pct of the data filesystem. Or a size in MB.
postgresql_max_slot_wal_keep_size: auto
postgresql_slot_wal_keep_pct: 20

# ---------------------------------------------------------------- nginx / tls
nginx_server_name: "{{ mattermost_site_url | urlsplit('hostname') }}"
# Mattermost app servers behind this proxy (host:port). Blank = local Mattermost.
nginx_upstreams: []
# auto = Mattermost's MaxFileSize plus 1 MB of overhead. That is 101M normally,
# and more where call recording is on, because a recording uploads through here.
nginx_client_max_body_size: auto
nginx_hsts: false
nginx_tls_profile: compatible     # compatible = TLS 1.2 and 1.3, modern = TLS 1.3 only
nginx_cache_dir: /var/cache/nginx/mattermost
nginx_module_stream: ""          # RHEL 9 only, e.g. "1.24". Blank = default stream. Ignored on Debian and Ubuntu.
tls_mode: later                  # provided | later
tls_cert_file: ""                # PEM certificate (full chain preferred)
tls_key_file: ""
tls_chain_file: ""               # optional intermediates if not in the cert file
tls_source_dir: ""               # or a directory holding <server_name>.crt/.key or tls.crt/tls.key
tls_install_dir: /etc/pki/tls/mattermost

# ---------------------------------------------------------------- rtcd
rtcd_version: latest
# With rtcd_version latest, re-runs keep the installed rtcd unless this is set
# (install.sh --upgrade sets it too).
rtcd_allow_upgrade: false
rtcd_dir: /opt/rtcd
rtcd_api_port: 8045
rtcd_rtc_port: 8443
rtcd_ice_host_override: ""       # public IP or name clients use to reach rtcd
# Mattermost servers allowed to reach the rtcd API. Empty = localhost only.
rtcd_api_sources: []
# rtcd's own default is false. Mattermost's guidance is to turn it on only on a
# private network with access control, which is what rtcd_api_sources gives you:
# anyone who can reach port 8045 can start calls, and only those addresses can.
# Set this to false and register Mattermost through rtcd's admin API instead if
# the API port has to be reachable more widely than that.
rtcd_allow_self_registration: true

# ---------------------------------------------------------------- calls job service
# calls-offloader runs call recording, transcription and live captions. Each job
# is a short-lived container, so this server needs a Docker API, which no other
# component here does. Mattermost's starting size for it is 8 vCPU and 16 GB.
calls_offloader_version: latest
# With the version left at latest, re-runs keep the installed binary unless this
# is set (install.sh --upgrade sets it too), the same as rtcd.
calls_offloader_allow_upgrade: false
calls_offloader_user: calls-offloader
calls_offloader_dir: /opt/calls-offloader
calls_offloader_conf_dir: /etc/calls-offloader
calls_offloader_data_dir: /var/lib/calls-offloader
calls_offloader_api_port: 4545
# Mattermost servers allowed to reach the job service API. Empty = localhost only.
calls_offloader_api_sources: []
# As with rtcd: upstream ships this off, and turning it on is what lets Mattermost
# register itself. Safe only because calls_offloader_api_sources is the access
# control. Anyone who can reach port 4545 with this on can make this server run
# containers, so never open it widely.
calls_offloader_allow_self_registration: true
# auto = from the host's CPU count and the recording quality, using Mattermost's
# published benchmarks (8 vCPU sustains 8 low, 6 medium or 4 high recordings).
calls_offloader_max_concurrent_jobs: auto
calls_offloader_failed_jobs_retention: 30d
# Where job runner images come from. Point it at an internal mirror if you have one.
calls_offloader_image_registry: mattermost
# Set to "host" where Docker's default bridge can't reach Mattermost (some VMs).
calls_offloader_docker_network: ""
# Install and manage Docker. Set it to false if you manage Docker yourself: the
# role then checks the socket is there and usable, and installs nothing.
calls_offloader_manage_docker: true
# Job runner images. These follow the Calls *plugin*, not calls-offloader: the
# plugin has the tags built in. Check them when you upgrade Mattermost, and see
# the job service section of the README.
calls_offloader_recorder_image: "mattermost/calls-recorder:v0.8.8"
calls_offloader_transcriber_image: "mattermost/calls-transcriber:v0.7.1"

# ---------------------------------------------------------------- opensearch
opensearch_version: "2.19.7"
opensearch_gpg_fingerprint: C5B7498965EFD1C2924BA9D539D319879310D3FC
opensearch_dir: /opt/opensearch
opensearch_conf_dir: /etc/opensearch
opensearch_data_dir: /var/lib/opensearch
opensearch_log_dir: /var/log/opensearch
opensearch_port: 9200
opensearch_heap_mb: auto
# Mattermost servers allowed to connect. Non-empty turns the security plugin on.
opensearch_allowed_clients: []
opensearch_admin_password: ""
# Mattermost connects as its own account holding this role, not as a cluster
# administrator: its password is on every app server. roles/opensearch/defaults
# has the permissions, which are Mattermost's own published set.
opensearch_mattermost_role_name: mattermost_search
# Which indices that role covers. This node is built for Mattermost alone, so
# empty (every index) is still only Mattermost's own data. If you ever point
# something else at this cluster, set a prefix here and the same value in
# ElasticsearchSettings.IndexPrefix on the app servers, through
# mattermost_config_overrides. They have to match or searching finds nothing.
opensearch_mattermost_index_prefix: ""

# ---------------------------------------------------------------- nfs storage
# An NFS server for Mattermost's data directory, so several app servers can share
# one copy of the uploaded files (and so backups have one place to run). This
# server only serves the share: mount it on the app servers yourself. The report
# this run writes gives the mount command and the fstab line to use.
nfs_export_dir: /srv/mattermost/data
# Mattermost app servers allowed to mount the share (addresses or CIDRs).
nfs_allowed_clients: []
# Servers allowed to mount it read-only, e.g. a backup server.
nfs_readonly_clients: []
nfs_port: 2049
# Who owns the share. With nfs_squash all, every client write lands as this user,
# so the mattermost user on the app servers doesn't need the same uid as here.
nfs_owner_user: mattermost
nfs_owner_group: mattermost
# Pin the ids when the app servers mount with nfs_squash none, or when files
# restored from elsewhere already belong to a particular uid.
nfs_owner_uid: ""
nfs_owner_gid: ""
nfs_export_mode: "0750"
# all = every client write lands as nfs_owner_user, whatever uid asked for it.
# none = the client's own uid and gid are kept and must match this server's.
# root on a client is squashed to nfs_owner_user either way.
nfs_squash: all
# sync = a write is acknowledged once it is on disk. async is faster and risks
# losing recent uploads if this server loses power.
nfs_write_mode: sync
# auto = four nfsd threads per vCPU, at least 8.
nfs_threads: auto
# Appended to the export options as given, e.g. [no_wdelay]
nfs_export_extra_options: []
# What the report tells you to mount the share with on the app servers. hard keeps
# Mattermost waiting through a server restart rather than failing writes.
nfs_mount_options: "rw,hard,timeo=600,retrans=2,noatime,nodiratime,_netdev"

# ---------------------------------------------------------------- monitoring
prometheus_version: "3.15.1"
prometheus_port: 9090
prometheus_retention: 15d
prometheus_scrape_interval: 30s
prometheus_data_dir: /var/lib/prometheus
# Extra jobs: [{job: name, targets: ["host:port"], metrics_path: /metrics, scheme: http}]
prometheus_scrape_targets: []
# Hosts allowed to reach the Prometheus UI/API. Empty = localhost only.
prometheus_allowed_sources: []
node_exporter_version: "1.12.1"
node_exporter_port: 9100
postgres_exporter_version: "0.20.1"
postgres_exporter_port: 9187
# Prometheus servers allowed to scrape exporters and Mattermost metrics here.
monitoring_scrape_sources: []
nginx_exporter_version: "1.5.3"
nginx_exporter_port: 9113
nginx_stub_status_port: 81           # http_port_t in SELinux, bound to 127.0.0.1 only
opensearch_exporter_version: "1.11.0"
opensearch_exporter_port: 9114
blackbox_exporter_version: "0.29.1"
blackbox_exporter_port: 9115
grafana_version: "13.3.0"
grafana_port: 3000
grafana_admin_password: ""
grafana_prometheus_url: ""       # blank = local Prometheus
# Hosts allowed to reach Grafana. Empty = open to all (Grafana has its own login).
grafana_allowed_sources: []

# ---------------------------------------------------------------- estate monitoring
# On the monitoring server: every server in the Mattermost estate and what it runs.
# Prometheus jobs, health checks, alert rules and dashboards are all built from this.
# This server is added automatically.
#   - {name: app01, address: 10.10.1.12, components: [mattermost, nginx]}
#   - {name: db01, address: 10.10.1.11, components: [postgresql]}
monitoring_estate: []
# Build the tiered alert rules and the dashboards in Grafana.
monitoring_alerts_enabled: true
monitoring_dashboards_enabled: true
# URL users use. The monitoring server checks <url>/api/v4/system/ping from outside.
# blackbox_exporter is only installed when this is set or the estate runs rtcd.
monitoring_site_url: "{{ mattermost_site_url if 'mattermost' in (mmd_selected | default([])) else '' }}"
# Check the site's certificate against the system trust store (plus the CA file below).
monitoring_site_tls_verify: true
monitoring_site_ca_file: ""
# Per-rule changes, e.g. {disk-used: {tiers: {warning: 85}}, cpu-busy: {for: 30m}}.
# A tier set to null is switched off. Rule ids are listed in docs/alerts.md.
monitoring_alert_overrides: {}
monitoring_alerts_disabled: []

# ---------------------------------------------------------------- logging
# An OpenTelemetry Collector goes on every server that has a Loki to send to: Loki
# on this server, or logging_loki_url. Set this to false to leave one server out.
deploy_log_shipping: true
logging_loki_url: ""              # e.g. http://mon01.internal:3100 (blank = local Loki, or none)
loki_version: "3.7.9"
loki_port: 3100
loki_data_dir: /var/lib/loki
loki_retention_period: 336h       # 14 days
# Extra senders allowed to push to Loki. Servers in monitoring_estate are always allowed.
loki_allowed_sources: []
# The collector config uses component names from 0.165 (file_log, otlp_http); older releases reject it.
otel_collector_version: "0.165.0"
otel_collector_metrics_port: 8888
# The name logs are labelled with. Use the same name as this server's entry in the
# monitoring server's monitoring_estate, so alerts and the shipping check line up.
otel_collector_host_name: "{{ ansible_facts['hostname'] }}"
# Log files to tail when the component is on this server. nginx means error.log only.
otel_collector_sources: [mattermost, postgresql, nginx, opensearch]
otel_collector_nginx_access: false        # also ship access.log (large on busy sites)
otel_collector_journald: true             # systemd's messages about our units, and logs only in the journal
otel_collector_journald_extra_units: []   # opt-in extras, e.g. [sshd, sudo]
otel_collector_kernel: true               # kernel messages at error and above (disk and filesystem errors)
# Log alerts: lines matching these regexes never count towards the error-spike and
# new-error rules. Use it for errors you know about and have accepted.
logging_alert_ignore: []
# Added to last week's count before comparing, so quiet sites don't alert on 2 errors after 0.
logging_alert_baseline_smoothing: 20
