---
# Read-only. Shows what would be installed and any colocation or sizing advice.
# install.sh runs this before asking for confirmation.
- name: Plan a Mattermost deployment on this server
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Work out the plan
      ansible.builtin.include_role:
        name: common
        tasks_from: plan

    - name: Check the files the answer file points at
      ansible.builtin.include_role:
        name: common
        tasks_from: input_files

    - name: Check the ports are free
      ansible.builtin.include_role:
        name: common
        tasks_from: ports

    - name: Write the plan for the wrapper
      ansible.builtin.copy:
        dest: "{{ plan_output_file }}"
        mode: "0600"
        content: >-
          {{ {'components': mmd_selected, 'profiles': mmd_profiles_used, 'findings': mmd_findings,
              'sizing': mmd_sizing, 'tls_mode': tls_mode, 'site_url': mattermost_site_url,
              'online': deploy_online | bool, 'artifact_source': artifact_source,
              'mattermost_installed': mmd_mattermost_installed, 'mattermost_hold': mmd_mattermost_hold | bool,
              'mattermost_channel': mattermost_version_channel} | to_nice_json }}
      when: plan_output_file is defined
