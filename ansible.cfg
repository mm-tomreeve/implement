[defaults]
inventory = inventory/localhost.yml
roles_path = roles
collections_path = collections
retry_files_enabled = False
host_key_checking = False
gathering = smart
interpreter_python = /usr/bin/python3
callback_result_format = yaml
nocows = 1
ansible_managed = Managed by Mattermost Implement. Local changes are overwritten on the next run.
# install.sh sets ANSIBLE_LOG_PATH per run so each run keeps its own log.

[privilege_escalation]
become = False
