---
# Renders the plan logic and the architecture report for one scenario using
# made-up facts and results, so template and wiring mistakes show up without a
# RHEL server. tests/render/run.sh runs every scenario.
- name: Render a sample architecture report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fake the host facts
      fake_facts:
        facts:
          fqdn: "{{ render_host }}.example.internal"
          hostname: "{{ render_host }}"
          os_family: "{{ render_os_family | default('RedHat') }}"
          distribution: "{{ render_distribution | default('RedHat') }}"
          distribution_version: "{{ render_os | default('9.6') }}"
          distribution_major_version: "{{ (render_os | default('9.6')).split('.')[0] }}"
          architecture: x86_64
          kernel: "{{ '6.8.0-45-generic' if render_os_family | default('RedHat') == 'Debian' else '5.14.0-570.el9.x86_64' }}"
          memtotal_mb: "{{ render_ram | default(16000) | int }}"
          processor_vcpus: "{{ render_cpus | default(8) | int }}"
          default_ipv4: {address: 10.10.1.20}
          all_ipv4_addresses: [10.10.1.20]
          selinux: "{{ {'status': 'disabled'} if render_os_family | default('RedHat') == 'Debian' else {'status': 'enabled'} }}"

    - name: Run the plan
      ansible.builtin.include_role:
        name: common
        tasks_from: plan
      vars:
        # Scenarios carry render_* keys of their own.
        mmd_answers_strict: false

    - name: Check the scenario got the components it expects
      ansible.builtin.assert:
        that:
          - render_expect_selected | default([]) | difference(mmd_selected) | length == 0
          - render_expect_not_selected | default([]) | intersect(mmd_selected) | length == 0
        fail_msg: >-
          Selected {{ mmd_selected }}. Expected {{ render_expect_selected | default([]) }}
          and not {{ render_expect_not_selected | default([]) }}.
        quiet: true

    - name: Fake what an install would have produced
      ansible.builtin.set_fact:
        mmd_secrets: {db_password: x, opensearch_admin_password: x, opensearch_mattermost_password: x, grafana_admin_password: x, replication_password: x}
        mmd_artifact_mode: online
        mmd_artifact_warnings: []
        mmd_artifacts: >-
          {%- set out = {} -%}{%- for c in mmd_selected if c not in ['postgresql', 'nginx', 'nfs'] -%}
          {%- set _ = out.update({c: {'name': c, 'version': '1.2.3', 'filename': c ~ '-1.2.3-linux-amd64.tar.gz',
                'sha256': 'ab' * 32, 'checksum_verified': true, 'checksum_source': 'github-asset-digest',
                'signature': 'verified' if c in ['mattermost', 'opensearch'] else 'not published',
                'gpg_fingerprint': 'A1B31D46F0F3A10B02CF2D44F8F2C31744774B28', 'esr': true}}) -%}{%- endfor -%}{{ out }}
        mmd_versions: "{{ dict(mmd_selected | zip(mmd_selected | map('regex_replace', '^.*$', '1.2.3'))) }}"
        mmd_results:
          - "{{ {'component': 'host', 'name': 'SELinux is enforcing', 'severity': 'warning', 'status': 'skip', 'detail': 'Debian and Ubuntu do not use SELinux'}
                if render_os_family | default('RedHat') == 'Debian'
                else {'component': 'host', 'name': 'SELinux is enforcing', 'severity': 'warning', 'status': 'pass', 'detail': 'getenforce says Enforcing'} }}"
          - {component: mattermost, name: API ping returns OK, severity: critical, status: pass, detail: "HTTP 200, status OK"}
          - {component: nginx, name: Websocket upgrade reaches Mattermost, severity: warning, status: warn, detail: "HTTP 400 | pipe in detail"}
          - {component: nginx, name: Mattermost answers over HTTPS, severity: critical, status: skip, detail: TLS not configured yet}
        # What the nfs role works out from the ids on the server it exports from.
        mmd_nfs_uid: "997"
        mmd_nfs_gid: "995"
        mmd_nfs_rw_options: rw,sync,no_subtree_check,all_squash,anonuid=997,anongid=995
        mmd_nfs_ro_options: ro,sync,no_subtree_check,all_squash,anonuid=997,anongid=995
        mmd_host_firewall: ["public (active)", "  services: ssh", "  ports: 80/tcp 443/tcp"]
        mmd_host_selinux: "{{ 'not applicable' if render_os_family | default('RedHat') == 'Debian' else 'Enforcing' }}"
        mmd_host_disk: ["/ 34", "{{ postgresql_data_dir | dirname }} 12"]
        mmd_tls_info: ["subject=CN = chat.example.com", "issuer=CN = Example CA", "notAfter=Oct 28 00:00:00 2027 GMT"]
        mmd_deploy_failed: "{{ render_failed | default(false) }}"
        mmd_deploy_error: "Unpack Mattermost: example failure"

    - name: Build the alert and dashboard summary when Grafana is here
      ansible.builtin.include_role:
        name: grafana
        tasks_from: build_spec
      when: "'grafana' in mmd_selected"

    - name: Pretend nobody has added a contact point yet
      ansible.builtin.set_fact:
        mmd_results: "{{ mmd_results + [{'component': 'grafana', 'name': 'Somewhere for alerts to go', 'severity': 'info', 'status': 'warn', 'detail': 'placeholder only'}] }}"
      when: "'grafana' in mmd_selected"

    - name: Write the report
      ansible.builtin.include_role:
        name: report

    - name: Keep a copy under the scenario name
      ansible.builtin.copy:
        src: "{{ mmd_report_path }}"
        dest: "{{ render_out }}/{{ render_name }}.md"
        mode: "0644"

    - name: Render the Mattermost unit and check where it gets its config from
      when: "'mattermost' in mmd_selected"
      vars:
        _templates: "{{ playbook_dir }}/../../roles/mattermost/templates"
      block:
        # Last, so the role's defaults can't hide a gap in what the report sees.
        - name: Load the Mattermost role defaults
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../../roles/mattermost/defaults/main.yml"

        - name: Work out the settings the role owns, as the role does
          ansible.builtin.set_fact:
            _mm_owned: "{{ lookup('ansible.builtin.template', _templates ~ '/config-overrides.yml.j2') | from_yaml }}"

        - name: Render the systemd unit
          ansible.builtin.template:
            src: "{{ _templates }}/mattermost.service.j2"
            dest: "{{ render_out }}/{{ render_name }}.mattermost.service"
            mode: "0644"

        - name: Render the environment file
          ansible.builtin.template:
            src: "{{ _templates }}/mattermost.env.j2"
            dest: "{{ render_out }}/{{ render_name }}.mattermost.env"
            mode: "0600"

        - name: Check the unit points Mattermost at the right config
          ansible.builtin.assert:
            that:
              - _unit is search('(?m)^EnvironmentFile=' ~ mattermost_env_file ~ '$')
              - "'MM_CONFIG' not in _unit"
              - _env is search("(?m)^MM_CONFIG='postgres://[^']+'$")
            fail_msg: "{{ render_name }}.mattermost.service should load MM_CONFIG from {{ mattermost_env_file }}"
            quiet: true
          vars:
            _unit: "{{ lookup('ansible.builtin.file', render_out ~ '/' ~ render_name ~ '.mattermost.service') }}"
            _env: "{{ lookup('ansible.builtin.file', render_out ~ '/' ~ render_name ~ '.mattermost.env') }}"
