---
# Render scenario: a PostgreSQL primary on Debian 12, feeding one replica.
render_host: db02
render_os_family: Debian
render_distribution: Debian
render_os: "12.7"
deploy_name: chat-prod
deploy_profiles: [database]
postgresql_allowed_clients: [10.10.1.11, 10.10.1.12]
postgresql_replication: primary
postgresql_replica_hosts: [10.10.1.22]
deploy_monitoring_exporters: true
monitoring_scrape_sources: [10.10.9.5]
