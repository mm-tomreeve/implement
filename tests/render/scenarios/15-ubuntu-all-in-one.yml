---
# Render scenario: everything on one Ubuntu 24.04 server.
render_host: lab02
render_os_family: Debian
render_distribution: Ubuntu
render_os: "24.04"
render_ram: 8000
render_cpus: 4
deploy_name: lab
deploy_profiles: [all-in-one]
mattermost_site_url: https://lab.example.internal
mattermost_license_file: /root/licence.mattermost-license
tls_mode: provided
tls_cert_file: /root/lab.crt
tls_key_file: /root/lab.key
rtcd_ice_host_override: 203.0.113.10
render_expect_selected: [blackbox_exporter]
