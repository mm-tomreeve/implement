---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make venv
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make venv
      - run: make test

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make venv
      - run: make render
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-out
          path: tests/render/out/

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: make smoke
        env:
          # The runner has podman too, but rootless podman can't run the systemd container.
          ENGINE: docker
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-out
          path: tests/smoke/out/
